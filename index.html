<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PvZ Rogue</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin="anonymous"></script>
<style>
html,body{margin:0;min-height:100%;background:#052e16}#boot-status{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#052e16;color:#ecfccb;font:600 16px/1.5 system-ui,sans-serif;text-align:center}#boot-status.error{background:#1f0a0a;color:#fecaca;white-space:pre-wrap}
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-status">Loading PvZ Rogue…</div>
<script>
(()=>{
 const status=document.getElementById('boot-status');
 const root=()=>document.getElementById('root');
 const showError=(error)=>{const message=error&&(error.stack||error.message)?(error.stack||error.message):String(error||'Unknown startup error');status.classList.add('error');status.textContent='PvZ Rogue could not start.\n\n'+message+'\n\nTry a hard refresh. If this remains, send this message with the report.';console.error('PvZ Rogue startup failure:',error)};
 window.addEventListener('error',e=>{if(!root()?.childElementCount)showError(e.error||e.message)});
 window.addEventListener('unhandledrejection',e=>{if(!root()?.childElementCount)showError(e.reason)});
 (async()=>{try{
   if(!window.Babel)throw new Error('Pinned Babel compiler failed to load.');
   const response=await fetch('./app-source.html',{cache:'no-store'});
   if(!response.ok)throw new Error(`Could not load game source (HTTP ${response.status}).`);
   const html=await response.text();
   const doc=new DOMParser().parseFromString(html,'text/html');
   const tag=doc.querySelector('script[type="text/babel"]');
   if(!tag)throw new Error('Game source is missing its JSX module script.');
   status.textContent='Compiling PvZ Rogue…';
   const compiled=Babel.transform(tag.textContent,{presets:['react'],sourceType:'module',filename:'app-source.jsx'}).code;
   const script=document.createElement('script');script.type='module';script.textContent=compiled+'\n//# sourceURL=pvz-rogue.compiled.js';
   script.addEventListener('error',()=>{if(!root()?.childElementCount)showError(new Error('Compiled game module failed to load. Check network access to esm.sh.'))});
   document.body.appendChild(script);
   const start=Date.now();const watcher=setInterval(()=>{if(root()?.childElementCount){clearInterval(watcher);status.remove()}else if(Date.now()-start>15000){clearInterval(watcher);showError(new Error('The game did not mount within 15 seconds.'))}},200);
 }catch(error){showError(error)}})();
})();
</script>
</body>
</html>
