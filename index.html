<style>
html,body,#root{margin:0;width:100%;min-height:100%;background:#052e16}body{overflow:hidden}#boot-status{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#052e16;color:#ecfccb;font:600 16px/1.5 system-ui,sans-serif;text-align:center;white-space:pre-line}#boot-status.error{background:#1f0a0a;color:#fecaca;white-space:pre-wrap;overflow:auto;align-items:flex-start;text-align:left}body.low-spec svg{filter:none!important}body.low-spec [class*="backdrop-blur"]{backdrop-filter:none!important}body.low-spec [class*="blur-"]{filter:none!important}body.tier-low [class*="backdrop-blur"],body.tier-ultra [class*="backdrop-blur"]{backdrop-filter:none!important}body.tier-ultra [class*="shadow"]{box-shadow:none!important}body.tier-ultra svg{filter:none!important}body.tier-ultra *{text-shadow:none!important}#devin-toast{position:fixed;z-index:100000;left:50%;top:18px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:rgba(5,46,22,.94);border:1px solid rgba(190,242,100,.4);color:#ecfccb;font:800 16px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);pointer-events:none}
</style>

<body>
<div id="root"></div><div id="boot-status">Loading PvZ Rogue…</div>
<script>
(()=>{
 const status=document.getElementById('boot-status'),root=()=>document.getElementById('root');
 const cores=navigator.hardwareConcurrency||4,memory=Number(navigator.deviceMemory)||null,reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches,chromeOS=/CrOS/i.test(navigator.userAgent||''),dpr=Math.min(window.devicePixelRatio||1,2),pixelLoad=(window.innerWidth||1280)*(window.innerHeight||720)*dpr*dpr;
 let weakness=0;if(cores<=2)weakness+=4;else if(cores<=4)weakness+=2;else if(cores<=6)weakness+=1;if(memory!==null){if(memory<=2)weakness+=4;else if(memory<=4)weakness+=2;else if(memory<=6)weakness+=1}if(pixelLoad>4500000)weakness+=1;if(reducedMotion)weakness+=1;if(chromeOS)weakness+=1;
 let tier=weakness>=6?'ultra':weakness>=4?'low':weakness>=2?'medium':'full';if(chromeOS&&tier==='medium'&&(cores<=4||(memory!==null&&memory<=4)))tier='low';
 const devinMode=tier==='ultra'||(chromeOS&&tier==='low'&&(cores<=4||(memory!==null&&memory<=4))),lowSpec=tier==='ultra'||tier==='low';window.__PVZ_DEVICE_TIER__=tier;window.__PVZ_LOW_SPEC__=lowSpec;document.body.classList.add(`tier-${tier}`);if(lowSpec)document.body.classList.add('low-spec');if(devinMode)status.textContent='hi Devin 👋\n\nPotato graphics mode enabled. Building PvZ Rogue…';
 const showError=error=>{const message=Array.isArray(error)?error.join('\n\n'):error&&(error.stack||error.message)?(error.stack||error.message):String(error||'Unknown startup error');status.classList.add('error');status.textContent='PvZ Rogue could not start.\n\n'+message+'\n\nCopy this whole report and send it back.';console.error('PvZ Rogue startup failure:',error)};
 window.addEventListener('error',e=>{if(!root()?.childElementCount)showError(e.error||e.message)});window.addEventListener('unhandledrejection',e=>{if(!root()?.childElementCount)showError(e.reason)});
 (async()=>{try{
  const required=[['Babel',window.Babel,'Pinned Babel compiler'],['runtime',window.__patchPvZRogueSource,'Runtime game patch'],['immersive',window.__patchPvZRogueImmersive,'Immersive UI patch'],['portal',window.__patchPvZRoguePortal,'Fullscreen loadout patch'],['gameplay',window.__patchPvZRogueGameplay,'Gameplay polish patch'],['vader',window.__patchVaderVineArt,'Vader Vine art patch'],['buffs',window.__patchPvZRogueBuffsPerformance,'Buff/performance patch'],['air',window.__patchPvZRogueAirLoadout,'Air/loadout patch'],['pineapple',window.__patchPvZRoguePineappleVisco,'Pineapple/Visco patch'],['cleanup',window.__patchPvZRoguePineappleViscoCleanup,'Pineapple/Visco cleanup patch'],['charge',window.__patchPvZRoguePineappleRangeCharge,'Pineapple range-charge patch'],['face',window.__patchPvZRoguePineappleToughFace,'Pineapple tough-face patch'],['sunshroom',window.__patchPvZRogueSunshroomGrowth,'Sun-shroom growth patch'],['compatBefore',window.__patchPvZRogueBossProjectileCompatBefore,'Boss projectile compatibility patch'],['compatAfter',window.__patchPvZRogueBossProjectileCompatAfter,'Boss projectile compatibility restore patch'],['boss',window.__patchPvZRogueBossMythic,'Boss/Mythic patch'],['dragonRider',window.__patchPvZRogueDragonRiderPopcorn,'Dragon Rider/Popping Corn patch'],['cornMythic',window.__patchPvZRoguePoppingCornMythicRework,'Popping Corn Mythic rework'],['mythicBalance',window.__patchPvZRogueMythicBalance,'Mythic balance patch'],['viscoFirePeas',window.__patchPvZRogueViscoFirePeas,'Visco fire pea fix'],['deadwoodSublime',window.__patchPvZRogueDeadwoodSublime,'Deadwood/Sublime patch'],['jackpotMythic',window.__patchPvZRogueJackpotMythic,'Jackpot Mythic patch'],['cooldowns',window.__patchPvZRoguePacketCooldowns,'Packet cooldown patch']];
  const loadErrors=[];for(const[key,fn,label]of required)if(!fn)loadErrors.push(`[LOAD ${key}] ${label} failed to load.`);if(loadErrors.length){showError(loadErrors);return;}
  const response=await fetch('./app-source.html',{cache:'no-store'});if(!response.ok)throw new Error(`Could not load game source (HTTP ${response.status}).`);const html=await response.text(),doc=new DOMParser().parseFromString(html,'text/html'),tag=doc.querySelector('script[type="text/babel"]');if(!tag)throw new Error('Game source is missing its JSX module script.');
  if(!devinMode)status.textContent=tier==='ultra'?'Potato-mode optimizing PvZ Rogue…':tier==='low'?'Optimizing PvZ Rogue for a low-spec device…':tier==='medium'?'Building PvZ Rogue with medium effects…':'Building PvZ Rogue with full effects…';
  const patchErrors=[];const apply=(label,fn,current)=>{try{return fn(current)}catch(err){const detail=err&&(err.stack||err.message)?(err.stack||err.message):String(err);patchErrors.push(`[${label}] ${detail}`);return current;}};
  let source=tag.textContent;
  source=apply('runtime',window.__patchPvZRogueSource,source);
  source=apply('immersive',window.__patchPvZRogueImmersive,source);
  source=apply('portal',window.__patchPvZRoguePortal,source);
  source=apply('gameplay',window.__patchPvZRogueGameplay,source);
  source=apply('vader',window.__patchVaderVineArt,source);
  source=apply('buffs/performance',window.__patchPvZRogueBuffsPerformance,source);
  source=apply('air/loadout',window.__patchPvZRogueAirLoadout,source);
  source=apply('pineapple/visco',window.__patchPvZRoguePineappleVisco,source);
  source=apply('pineapple cleanup',window.__patchPvZRoguePineappleViscoCleanup,source);
  source=apply('pineapple range charge',window.__patchPvZRoguePineappleRangeCharge,source);
  source=apply('pineapple face',window.__patchPvZRoguePineappleToughFace,source);
  source=apply('sunshroom growth',window.__patchPvZRogueSunshroomGrowth,source);
  source=apply('boss compat before',window.__patchPvZRogueBossProjectileCompatBefore,source);
  source=apply('boss/mythic',window.__patchPvZRogueBossMythic,source);
  source=apply('boss compat after',window.__patchPvZRogueBossProjectileCompatAfter,source);
  source=apply('dragon rider/popcorn',window.__patchPvZRogueDragonRiderPopcorn,source);
  source=apply('popping corn mythic',window.__patchPvZRoguePoppingCornMythicRework,source);
  source=apply('mythic balance',window.__patchPvZRogueMythicBalance,source);
  source=apply('visco fire peas',window.__patchPvZRogueViscoFirePeas,source);
  source=apply('deadwood/sublime',window.__patchPvZRogueDeadwoodSublime,source);
  source=apply('jackpot mythic',window.__patchPvZRogueJackpotMythic,source);
  source=apply('packet cooldowns',window.__patchPvZRoguePacketCooldowns,source);
  if(patchErrors.length){showError([`PATCH PREFLIGHT FOUND ${patchErrors.length} ERROR(S):`,...patchErrors]);return;}
  let compiled;try{compiled=Babel.transform(source,{presets:['react'],sourceType:'module',filename:'app-source.jsx'}).code}catch(err){showError([`[BABEL COMPILE] ${err&&(err.stack||err.message)?(err.stack||err.message):String(err)}`]);return;}
  const script=document.createElement('script');script.type='module';script.textContent=compiled+'\n//# sourceURL=pvz-rogue.compiled.js';script.addEventListener('error',()=>{if(!root()?.childElementCount)showError(new Error('Compiled game module failed to load. Check network access to esm.sh.'))});document.body.appendChild(script);
  const start=Date.now(),watcher=setInterval(()=>{if(root()?.childElementCount){clearInterval(watcher);status.remove();if(devinMode){const toast=document.createElement('div');toast.id='devin-toast';toast.textContent='hi Devin 👋';document.body.appendChild(toast);setTimeout(()=>toast.remove(),4500)}}else if(Date.now()-start>15000){clearInterval(watcher);showError(new Error('The game did not mount within 15 seconds.'))}},200);
 }catch(error){showError(error)}})();
})();
</script>
